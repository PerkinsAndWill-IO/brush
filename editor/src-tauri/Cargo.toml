[package]
name = "brush-editor"
version = "0.1.0"
description = "Brush Editor desktop shell (window, file dialogs, file drop). No app logic here."
edition = "2021"
publish = false

[lib]
name = "brush_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
